name: Compilar AAB para Google Play

on:
  push:
    paths: ['proyecto.txz', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
        run: |
          tar xJf proyecto.txz
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > MiHorario/app/subida.jks
          cd MiHorario
          pip install --quiet openpyxl
          python3 herramientas/plantilla.py
          gradle bundleRelease assembleRelease --no-daemon

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -oP 'versionCode \K[0-9]+' MiHorario/app/build.gradle)
          NAME=$(grep -oP "versionName '\K[^']+" MiHorario/app/build.gradle)
          cp MiHorario/app/build/outputs/bundle/release/app-release.aab MiHorario-$NAME.aab
          cp MiHorario/app/build/outputs/apk/release/app-release.apk MiHorario-$NAME.apk
          sha256sum MiHorario-$NAME.aab MiHorario-$NAME.apk
          gh release delete "v$CODE" --yes --cleanup-tag || true
          gh release create "v$CODE" MiHorario-$NAME.aab MiHorario-$NAME.apk --title "Versión $NAME" --notes "Mi Horario $NAME"
